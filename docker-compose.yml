version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: recruiter_db
      POSTGRES_USER: recruiter_user
      POSTGRES_PASSWORD: recruiter_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://recruiter_user:recruiter_password@db:5432/recruiter_db

  celery:
    build: .
    command: celery -A recruiter_project worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://recruiter_user:recruiter_password@db:5432/recruiter_db

volumes:
  postgres_data:
